server {
    listen 80;
    server_name _;

    # /api/* -> api container, with the /api/ prefix stripped.
    # The trailing slash on proxy_pass replaces the matched location prefix.
    location /api/ {
        proxy_pass http://api:8000/;
        include /etc/nginx/conf.d/snippets/proxy.conf;
    }

    location / {
        proxy_pass http://web:80;
        include /etc/nginx/conf.d/snippets/proxy.conf;
    }
}
