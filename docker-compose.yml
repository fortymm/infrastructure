name: fortymm

services:
  nginx:
    image: nginx:alpine
    container_name: fortymm-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "127.0.0.1:4000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/conf.d/snippets:ro

  web:
    image: ghcr.io/fortymm/web-client:sha-f607376
    container_name: fortymm-web
    restart: unless-stopped

  api:
    image: ghcr.io/fortymm/api:sha-8f75b97
    container_name: fortymm-api
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fortymm:${POSTGRES_PASSWORD}@db:5432/fortymm
      JWT_SECRET: ${JWT_SECRET}

  db:
    image: postgres:16
    container_name: fortymm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fortymm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fortymm
    volumes:
      - fortymm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortymm -d fortymm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fortymm-db-data:
